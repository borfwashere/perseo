<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Scanner Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #111111;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(0,0,0,0.12);
      background: #ffffff;
      position: relative;
      z-index: 10;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.05em;
      margin-right: 8px;
      white-space: nowrap;
    }
    .brand a { color: #111111; text-decoration: none; }
    .brand a:hover { color: #555555; }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
      align-items: center;
      margin-left: auto;
    }
    .nav-links a {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #666666;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .nav-links a:hover { color: #000000; }
    .nav-links a.active { color: #000000; }

    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #111111;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.3);
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      transition: all .15s ease;
      white-space: nowrap;
    }
    .btn:hover { background: #000000; color: #ffffff; border-color: #000000; }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: #000000; color: #ffffff; border-color: #000000; }
    .btn-primary:hover { background: #333333; }
    .btn-danger { background: #000000; color: #ffffff; border-color: #000000; }
    .btn-danger:hover { background: #333333; }
    .btn-disabled { opacity: .35; pointer-events: none; }

    select {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #111111;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.3);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .divider { width: 1px; height: 24px; background: rgba(0,0,0,0.2); }

    .rec-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .rec-btn .rec-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #000000;
      opacity: .25;
    }
    .rec-btn.recording .rec-dot { opacity: 1; animation: blink 1s infinite; }
    .rec-btn.armed .rec-dot { opacity: 1; animation: pulse 1.5s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    @keyframes pulse { 50% { opacity: .4; } }

    .status {
      font-size: 12px;
      opacity: .6;
      white-space: nowrap;
    }

    .scan-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
      min-height: 0;
    }

    .panel {
      position: relative;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .panel canvas { display: block; }

    .panel-label {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: #111111;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 2;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }

    .modal-content {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 24px;
      width: min(480px, 90vw);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .modal-content h3 {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .modal-sub { font-size: 11px; opacity: .6; margin-bottom: 12px; }

    .fx-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    .fx-row label { font-size: 13px; font-weight: 700; width: 90px; flex-shrink: 0; }
    .fx-row select { border-radius: 6px; padding: 6px 10px; }

    .fx-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0;
    }
    .fx-btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #111111;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.3);
      border-radius: 6px;
      padding: 12px 8px;
      cursor: pointer;
      transition: background .1s, color .1s, transform .1s;
    }
    .fx-btn:hover { transform: translateY(-1px); }
    .fx-btn.active {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    .fx-preview-wrap { margin: 16px 0; text-align: center; }
    .fx-preview-wrap canvas {
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      background: #fafafa;
      max-width: 100%;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #111111;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 10px 20px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      .scan-area { flex-direction: column; }
      .toolbar { gap: 6px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="brand"><a href="../index.html">MEDUSA</a></span>
    <button class="btn" id="btnLoad">Load Image</button>
    <button class="btn btn-primary" id="btnScan">Start Scan</button>
    <button class="btn" id="btnStop">Stop</button>
    <button class="btn" id="btnUndo">Undo</button>
    <button class="btn" id="btnEffects">Effects</button>
    <button class="btn" id="btnGhost">Ghost</button>
    <span class="divider"></span>
    <select id="selLayerBlend" title="Blend mode">
      <option value="normal">Normal</option>
      <option value="multiply">Multiply</option>
      <option value="screen">Screen</option>
    </select>
    <span class="divider"></span>
    <select id="selFormat" title="Format">
      <option value="free">Free</option>
      <option value="16:9">16:9</option>
      <option value="4:5">4:5</option>
      <option value="1:1">1:1</option>
      <option value="a4">A4</option>
    </select>
    <select id="selSpeed" title="Speed">
      <option value="slow">Slow</option>
      <option value="normal" selected>Normal</option>
      <option value="fast">Fast</option>
    </select>
    <button class="btn rec-btn" id="btnRec">
      <span class="rec-dot"></span>
      REC
    </button>
    <span class="divider"></span>
    <button class="btn" id="btnSavePng">Save PNG</button>
    <button class="btn" id="btnSaveWebM">Save WebM</button>
    <span class="status" id="statusText">Load an image to start</span>
    <nav class="nav-links">
      <a href="../mindcut/index.html">mind</a>
      <a href="../cut/index.html">cut</a>
      <a href="#" class="active">scanner</a>
    </nav>
  </div>

  <div class="scan-area">
    <div class="panel">
      <span class="panel-label">SOURCE</span>
      <canvas id="srcCanvas"></canvas>
    </div>
    <div class="panel">
      <span class="panel-label">RESULT</span>
      <canvas id="outCanvas"></canvas>
    </div>
  </div>

  <div class="modal hidden" id="effectsModal">
    <div class="modal-content">
      <h3>EFFECTS</h3>
      <div class="modal-sub">Select effects to apply</div>
      <div class="fx-preview-wrap">
        <canvas id="fxPreview" width="320" height="320"></canvas>
      </div>
      <div class="fx-grid">
        <button class="fx-btn" data-fx="bw">B&amp;W</button>
        <button class="fx-btn" data-fx="threshold">Threshold</button>
        <button class="fx-btn" data-fx="invert">Invert</button>
        <button class="fx-btn" data-fx="posterize">Posterize</button>
        <button class="fx-btn" data-fx="noise">Noise</button>
        <button class="fx-btn" data-fx="dither">Dither</button>
      </div>
      <div class="modal-actions">
        <button class="btn" id="btnCloseFx">Cancel</button>
        <button class="btn btn-primary" id="btnApplyFx">Apply</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <div class="toast" id="toast"></div>

  <script src="scanner.js"></script>
</body>
</html>
