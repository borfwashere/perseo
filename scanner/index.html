<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0000f2">
  <title>scanner — PERSEO</title>
  <link rel="stylesheet" href="../base.css">
  <style>
    body {
      font-family: var(--font-mono);
      font-size: var(--text-base);
      background: var(--sisifo-bg);
      color: var(--sisifo-fg);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--sisifo-border);
      gap: 16px;
      flex-wrap: nowrap;
      overflow-x: auto;
      flex-shrink: 0;
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: nowrap;
      align-items: center;
      overflow-x: auto;
      min-width: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 14px;
      border-right: 1px solid var(--sisifo-border);
    }

    .control-group:last-child {
      border-right: none;
      padding-right: 0;
    }

    .group-label {
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.5;
      padding-right: 4px;
      font-weight: 700;
    }

    .select-control {
      display: inline-flex;
      align-items: center;
      border: none;
      padding: 0 4px;
      height: 26px;
      box-sizing: border-box;
      font: inherit;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      position: relative;
    }
    .select-control::after {
      content: '▾';
      font-size: 9px;
      margin-left: 6px;
      opacity: 0.6;
    }
    .select-control select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      border: none;
      background: transparent;
      font: inherit;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: inherit;
      cursor: pointer;
      padding: 0;
      outline: none;
    }
    .select-control select option {
      background: var(--sisifo-accent);
      color: var(--sisifo-bg);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
      margin-left: auto;
    }
    .nav-links a {
      font-size: var(--text-md);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sisifo-fg);
      opacity: 0.7;
      text-decoration: none;
      transition: color var(--transition-base);
    }
    .nav-links a:hover { color: var(--sisifo-accent); opacity: 1; }
    .nav-links a.active { color: var(--sisifo-accent); opacity: 1; }

    .rec-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .rec-btn .rec-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--sisifo-accent);
      opacity: .25;
    }
    .rec-btn.recording .rec-dot { opacity: 1; animation: blink 1s infinite; }
    .rec-btn.armed .rec-dot { opacity: 1; animation: pulse 1.5s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    @keyframes pulse { 50% { opacity: .4; } }

    .status {
      font-size: var(--text-sm);
      opacity: .6;
      white-space: nowrap;
      padding: var(--space-2) var(--space-4);
      border-bottom: 1px solid var(--sisifo-border);
    }

    .scan-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: var(--space-4);
      min-height: 0;
    }

    .panel {
      position: relative;
      border: 1px solid var(--sisifo-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--sisifo-bg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      flex-shrink: 0;
      max-height: var(--canvas-max-h, calc(100vh - 240px));
    }
    .panel canvas { display: block; max-width: 100%; max-height: var(--canvas-max-h, calc(100vh - 240px)); }

    .panel-label {
      position: absolute;
      top: 10px;
      left: 14px;
      background: var(--sisifo-bg);
      color: var(--sisifo-fg);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      pointer-events: none;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .scan-area { flex-direction: column; }
      .controls { gap: 6px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SCANNER</h1>
    <div class="controls">
      <div class="control-group">
        <span class="group-label">file</span>
        <button class="btn" id="btnLoad">load</button>
      </div>
      <div class="control-group">
        <span class="group-label">scan</span>
        <button class="btn btn-primary" id="btnScan">start</button>
        <button class="btn" id="btnStop">stop</button>
        <button class="btn" id="btnUndo">undo</button>
      </div>
      <div class="control-group">
        <span class="group-label">fx</span>
        <label class="select-control" title="filter applied to result">
          <select id="effect">
            <option value="none">effect: none</option>
            <option value="bw">effect: b&amp;w</option>
            <option value="threshold">effect: threshold</option>
            <option value="invert">effect: invert</option>
            <option value="posterize">effect: posterize</option>
            <option value="dither">effect: dither</option>
          </select>
        </label>
        <select id="selLayerBlend" title="Blend mode">
          <option value="normal">normal</option>
          <option value="multiply">multiply</option>
          <option value="screen">screen</option>
        </select>
      </div>
      <div class="control-group">
        <span class="group-label">format</span>
        <select id="selFormat" title="Format">
          <option value="free">free</option>
          <option value="16:9">16:9</option>
          <option value="4:5">4:5</option>
          <option value="1:1">1:1</option>
          <option value="a4">a4</option>
        </select>
        <select id="selSpeed" title="Speed">
          <option value="slow">slow</option>
          <option value="normal" selected>normal</option>
          <option value="fast">fast</option>
        </select>
      </div>
      <div class="control-group">
        <span class="group-label">rec</span>
        <button class="btn rec-btn" id="btnRec">
          <span class="rec-dot"></span>
          rec
        </button>
      </div>
      <div class="control-group">
        <span class="group-label">save</span>
        <button class="btn" id="btnSavePng">png</button>
        <button class="btn" id="btnSaveWebM">webm</button>
      </div>
    </div>
    <nav class="nav-links">
      <a href="../index.html">PERSEO</a>
      <a href="../mindcut/index.html">mind</a>
      <a href="../cut/index.html">cut</a>
    </nav>
  </header>

  <span class="status" id="statusText">Load an image to start</span>

  <div class="scan-area">
    <div class="panel">
      <span class="panel-label">SOURCE</span>
      <canvas id="srcCanvas"></canvas>
    </div>
    <div class="panel">
      <span class="panel-label">RESULT</span>
      <canvas id="outCanvas"></canvas>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <img id="preset" src="../perseo.png" alt="" style="position:absolute;left:-9999px;top:-9999px">
  <div class="toast" id="toast"></div>

  <script src="scanner.js?v=2"></script>
</body>
</html>
