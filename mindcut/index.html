<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0000f2">
    <title>mindcut – Cut. Rearrange. Multiply.</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MINDCUT</h1>
        <div class="controls">
            <div class="control-group">
                <span class="group-label">file</span>
                <label class="btn" for="upload">upload</label>
                <input type="file" id="upload" accept="image/*" hidden>
            </div>

            <div class="control-group">
                <span class="group-label">cut</span>
                <button id="cut" class="btn primary" disabled title="apply cut">cut</button>
                <label class="stepper" title="number of slices">
                    slices
                    <button type="button" id="slices-down" class="step" aria-label="decrease">-</button>
                    <input type="number" id="slices-input" min="2" max="50" value="10">
                    <button type="button" id="slices-up" class="step" aria-label="increase">+</button>
                </label>
            </div>

            <div class="control-group">
                <span class="group-label">copies</span>
                <button id="copies-2" class="btn active" title="2 copies">2</button>
                <button id="copies-4" class="btn" title="4 copies">4</button>
            </div>

            <div class="control-group">
                <span class="group-label">effect</span>
                <label class="select-control" title="filter applied to result">
                    <select id="effect">
                        <option value="none">effect: none</option>
                        <option value="bw">effect: b&amp;w</option>
                        <option value="threshold">effect: threshold</option>
                        <option value="dither">effect: dither</option>
                        <option value="invert">effect: invert</option>
                    </select>
                </label>
            </div>

            <div class="control-group">
                <span class="group-label">save</span>
                <button id="save" class="btn" disabled title="download result">save</button>
            </div>
        </div>
        <nav class="nav-links">
            <a href="../index.html">PERSEO</a>
            <a href="../cut/index.html">cut</a>
            <a href="../scanner/index.html">scanner</a>
        </nav>
    </header>

<section class="app" id="app">
        <main class="workspace">
            <section class="panel">
                <div class="panel-label">source</div>
                <div id="source-wrap" class="canvas-wrap empty">drop or upload an image</div>
            </section>
            <section class="panel">
                <div class="panel-label">result</div>
                <div id="result-wrap" class="canvas-wrap empty">press cut</div>
                <div id="downloads" class="downloads"></div>
            </section>
        </main>
    </section>

<img id="preset" src="../perseo.png" alt="" style="position:absolute;left:-9999px;top:-9999px">

<script src="app.js?v=2"></script>
</body>
</html>
